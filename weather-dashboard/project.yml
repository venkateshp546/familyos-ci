name: WeatherDashboard
options:
  bundleIdPrefix: com.vtsapps
  deploymentTarget:
    iOS: "16.0"
targets:
  WeatherDashboard:
    type: application
    platform: iOS
    sources:
      - ios/WeatherDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vtsapps.weatherdashboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location helps show local weather."
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
