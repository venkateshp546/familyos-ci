# Copy to venkateshp546/familyos-ci/.github/workflows/ (public repo, free macOS minutes).
# Needs secret FAMILY_LEGACY_SSH_KEY there (read-only deploy key on family-legacy).
name: Family Vault iOS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from the private family-legacy repository'
        required: true
        default: 'main'
        type: string

jobs:
  build-ios:
    name: Build iOS (${{ inputs.branch }})
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Xcode passes module, index and pch flags ccache must not key on.
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_MAXSIZE: 2G
      # Clang modules are only cacheable in depend mode.
      CCACHE_DEPEND: 'true'
    steps:
      - name: Checkout private family-legacy
        uses: actions/checkout@v4
        with:
          repository: venkateshp546/family-legacy
          ssh-key: ${{ secrets.FAMILY_LEGACY_SSH_KEY }}
          ref: ${{ inputs.branch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: ${{ runner.os }}-fv-core-${{ hashFiles('core/Cargo.lock', 'core/src/**') }}
          restore-keys: ${{ runner.os }}-fv-core-

      # Windows hosts cannot run the core tests; run them natively here.
      - name: Test Rust core
        working-directory: core
        run: cargo test --release --lib

      # strip=true empties the static library's symbol table on Apple; Xcode strips the app instead.
      - name: Build Rust core for iOS
        working-directory: core
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'false'
          CARGO_PROFILE_RELEASE_LTO: 'false'
        run: |
          cargo build --release --lib --target aarch64-apple-ios
          L=target/aarch64-apple-ios/release/libfv_core.a
          ls -la $L; ar t $L | head -5; nm -gU $L 2>&1 | grep -E "fv_|error" | head -5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          cache: true

      # ccache keys compiles by content, so it hits on fresh checkouts where
      # DerivedData (mtime-based) rebuilds everything.
      - name: Install ccache
        run: |
          brew install ccache
          mkdir -p $HOME/bin
          printf '#!/bin/sh\nexec ccache "$(xcrun -f clang)" "$@"\n' > $HOME/bin/ccache-clang
          printf '#!/bin/sh\nexec ccache "$(xcrun -f clang++)" "$@"\n' > $HOME/bin/ccache-clang++
          chmod +x $HOME/bin/ccache-clang $HOME/bin/ccache-clang++

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-fv-${{ runner.os }}-

      # Swift packages (firebase-ios-sdk is a large clone) and Xcode build products.
      - name: Cache Swift packages and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-fv-xcode-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-fv-xcode-

      # FLUTTER_XCODE_* env vars are passed to xcodebuild as build settings.
      - name: Build iOS app (unsigned)
        working-directory: app
        env:
          FLUTTER_XCODE_CC: /Users/runner/bin/ccache-clang
          FLUTTER_XCODE_CXX: /Users/runner/bin/ccache-clang++
          FLUTTER_XCODE_LD: clang
          FLUTTER_XCODE_LDPLUSPLUS: clang++
          FLUTTER_XCODE_COMPILER_INDEX_STORE_ENABLE: 'NO'
          FLUTTER_XCODE_CLANG_ENABLE_EXPLICIT_MODULES: 'NO'
        run: flutter build ios --release --no-codesign --dart-define=GOOGLE_SERVER_CLIENT_ID=766760566795-4tj4rtag8rti206nd2vfvek3uu8aqhfn.apps.googleusercontent.com

      - name: ccache stats
        if: always()
        run: ccache -sv

      # Saved even when the build fails, so finished compiles are reused next run.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fv-${{ runner.os }}-${{ github.run_id }}

      - name: Check the Rust core is linked
        working-directory: app
        run: |
          B=build/ios/iphoneos/Runner.app/Runner
          echo "lib defines: $(nm -gU ../core/target/aarch64-apple-ios/release/libfv_core.a 2>&1 | grep -c '_fv_call')"
          echo "binary any:  $(nm -m $B | grep -c '_fv_call')"; nm -m $B | grep '_fv_' | head -4
          echo "exports:     $(dyld_info -exports $B 2>/dev/null | grep -c fv_call)"
          dyld_info -exports $B 2>/dev/null | grep fv_call && exit 0
          exit 1

      - name: Package IPA for sideloading
        working-directory: app
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -r -q FamilyVault.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-IPA
          path: app/build/FamilyVault.ipa
          retention-days: 14

      # cleanup.yml deletes finished runs (and their artifacts), so keep the IPA as a private release.
      - name: Publish release to private family-legacy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh release delete ios-latest -R venkateshp546/family-legacy -y --cleanup-tag || true
          gh release create ios-latest app/build/FamilyVault.ipa -R venkateshp546/family-legacy \
            --target "${{ inputs.branch }}" --title "Family Vault iOS latest" \
            --notes "Unsigned build of ${{ inputs.branch }} ($(date -u +'%Y-%m-%d %H:%M UTC'))" --latest
