name: FamilyOS Android &amp; Validation CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from FamilyOS private repository'
        required: true
        default: 'master'
        type: string
      build_android:
        description: 'Build Android APK'
        required: true
        default: true
        type: boolean
      emulator_e2e:
        description: 'Boot the built APK on a real accelerated emulator and smoke-test it'
        required: true
        default: true
        type: boolean

jobs:
  validate-and-build:
    name: Verify &amp; Build (${{ inputs.branch || 'master' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private FamilyOS Repository
        uses: actions/checkout@v4
        with:
          repository: venkateshp546/FamilyOS
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
          ref: ${{ inputs.branch || 'master' }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: |
          pnpm --filter @familyos/core-contracts build

      - name: Contracts tests
        run: pnpm --filter @familyos/core-contracts test

      - name: Mobile typecheck
        run: pnpm --filter @familyos/mobile exec tsc --noEmit -p tsconfig.json

      - name: Mobile tests
        run: pnpm --filter @familyos/mobile test

      - name: Lint
        run: pnpm exec eslint apps packages --max-warnings 0

      - name: Cloud typecheck
        run: pnpm --filter @familyos/cloud exec tsc --noEmit -p tsconfig.json

      - name: Cloud tests
        run: pnpm --filter @familyos/cloud test

      - name: Check architecture boundaries
        shell: bash
        run: |
          leaks=$(grep -rn "services/cloud" apps/mobile/src \
            --include=*.ts --include=*.tsx \
            | grep -v "src/services/cloud/" \
            | grep -v "src/services/providers.ts" || true)
          if [ -n "$leaks" ]; then
            echo "A provider implementation is imported outside providers.ts:"
            echo "$leaks"
            exit 1
          fi

      - name: Android Build
        if: ${{ inputs.build_android == true || inputs.build_android == 'true' }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Everything below is a real device signal, not a mock: ubuntu-latest
      # GitHub-hosted runners have /dev/kvm, so this is genuine hardware-
      # accelerated Android, not the unaccelerated QEMU fallback that makes
      # an emulator impractical in a plain container. Deliberately a smoke
      # test only (install, launch, confirm no crash, screenshot) rather
      # than a scripted user-flow E2E suite - this repo has no Detox/Maestro
      # setup yet, and a real crash-on-launch signal is the highest-value
      # thing to add first. A scripted flow suite is a follow-up, not this.
      - name: Enable KVM group perms for the emulator
        if: ${{ (inputs.build_android == true || inputs.build_android == 'true') && (inputs.emulator_e2e == true || inputs.emulator_e2e == 'true') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke-test the built APK
        if: ${{ (inputs.build_android == true || inputs.build_android == 'true') && (inputs.emulator_e2e == true || inputs.emulator_e2e == 'true') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            APK=$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n com.vtsapps.familyos/.MainActivity
            echo "Waiting for the app to settle..."
            sleep 20
            mkdir -p e2e-artifacts
            adb exec-out screencap -p > e2e-artifacts/launch-screenshot.png
            adb logcat -d > e2e-artifacts/logcat.txt
            if grep -q "FATAL EXCEPTION" e2e-artifacts/logcat.txt || grep -q "AndroidRuntime: FATAL" e2e-artifacts/logcat.txt; then
              echo "App crashed on launch - see e2e-artifacts/logcat.txt"
              grep -A 30 "FATAL EXCEPTION" e2e-artifacts/logcat.txt || true
              exit 1
            fi
            RUNNING=$(adb shell "pidof com.vtsapps.familyos" || true)
            if [ -z "$RUNNING" ]; then
              echo "App process is not running after launch (crashed or never started)"
              exit 1
            fi
            echo "App launched and is still running (pid $RUNNING) after 20s - smoke test passed"

      - name: Upload E2E smoke-test artifacts
        if: ${{ always() && (inputs.build_android == true || inputs.build_android == 'true') && (inputs.emulator_e2e == true || inputs.emulator_e2e == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-smoke-test
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Publish Android APK to Private FamilyOS Releases
        if: ${{ inputs.build_android == true || inputs.build_android == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          TAG_NAME="android-latest"
          echo "Publishing APK directly to private FamilyOS repository release: $TAG_NAME"
          gh release delete "$TAG_NAME" -R venkateshp546/FamilyOS -y --cleanup-tag || true
          gh release create "$TAG_NAME" apps/mobile/android/app/build/outputs/apk/debug/*.apk \
            -R venkateshp546/FamilyOS \
            --target "${{ inputs.branch || 'claude/familyos-forensic-audit-ik0uoc' }}" \
            --title "FamilyOS Android Latest Build" \
            --notes "Automated build of branch ${{ inputs.branch || 'claude/familyos-forensic-audit-ik0uoc' }} ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --latest
